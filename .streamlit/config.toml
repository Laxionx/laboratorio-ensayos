# Configuración para la app pública (Streamlit Community Cloud). La app solo recibe CSV y .xlsx para
# las tablas (nunca se guardan), no usa secretos y todos sus controles tienen límites.

[client]
# Sin trazas ni rutas internas en el navegador: solo un mensaje genérico.
showErrorDetails = "none"
# Oculta las opciones de desarrollador (rerun, clear cache, deploy) a los visitantes.
toolbarMode = "viewer"

[server]
# Tope de lo que se sube a una tabla (MB); `app/carga.py` lo verifica también en el código.
maxUploadSize = 1
enableXsrfProtection = true
runOnSave = false

[browser]
gatherUsageStats = false

[theme]
# Cuaderno de planta: papel cálido, tinta oscura, terracota de acento. Títulos con serifa,
# texto sin serifa.
base = "light"
primaryColor = "#C0462B"
backgroundColor = "#FBF9F4"
secondaryBackgroundColor = "#EFE9DD"
textColor = "#1F2A30"
font = "sans-serif"
headingFont = "serif"
