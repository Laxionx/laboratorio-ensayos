[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muestreo"
version = "0.1.0"
description = "Laboratorio de ensayos al fuego, fase 1: error de muestreo (Gy) en la preparación de muestras y oro grueso"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anthony Vera Baldeón" }]
dependencies = [
    "numpy",
    "scipy",
    "conminucion @ git+https://github.com/Laxionx/simulador-conminucion.git@96a4fa468377bce2f839b04960dae4f76f5d625f",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
app = ["streamlit==1.65.0", "plotly==7.1.0"]

[tool.setuptools]
packages = ["muestreo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["muestreo"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
