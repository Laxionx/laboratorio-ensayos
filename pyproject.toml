[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muestreo"
version = "0.1.0"
description = "Laboratorio de ensayos al fuego, fase 1: error de muestreo (Gy) en la preparación de muestras y oro grueso"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anthony Vera Baldeón" }]
dependencies = [
    "numpy",
    "scipy",
    "conminucion @ git+https://github.com/Laxionx/simulador-conminucion.git@96a4fa468377bce2f839b04960dae4f76f5d625f",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-xdist", "basedpyright", "ruff"]
app = [
    "streamlit==1.66.1",
    "pillow==13.0.0",
    "plotly==7.1.0",
    "openpyxl==3.1.5",
    "defusedxml==0.7.1",
]

[tool.setuptools]
packages = ["muestreo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto"
markers = ["app: corre la app entera con AppTest (lenta); `-m \"not app\"` las deja fuera"]

[tool.coverage.run]
source = ["muestreo"]

[tool.basedpyright]
include = ["muestreo", "app"]
extraPaths = ["app"]  # la app importa sus módulos por nombre, como en Streamlit Cloud
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/textos_*.py" = ["E501"]  # son diccionarios de texto: una línea larga es una frase
