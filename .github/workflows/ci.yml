name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Tipos (solo errores nuevos; los previos están en .basedpyright/baseline.json)
        run: basedpyright
      - name: Pytest con cobertura del paquete
        env:
          COVERAGE_CORE: sysmon  # cobertura de bajo costo (Python 3.12+): sin ella la suite tarda el doble
        run: pytest --cov=muestreo --cov-report=term-missing --cov-fail-under=90
